# Coverage thresholds for https://app.codecov.io/gh/patramsey/plat
#
# Without this file Codecov defaults both statuses to `target: auto`, which
# measures a pull request against whatever the base branch's coverage
# happens to be. That ratchets: every PR that improves coverage raises the
# bar for the next one, so a PR touching realistic code (defensive branches,
# CLI plumbing, a vendor quirk) fails for being merely good rather than
# better than average. A stated target is a standard the project can
# actually hold.
coverage:
  status:
    # project guards the codebase as a whole against slow erosion. The
    # threshold absorbs the small dips that come from honest refactors --
    # deleting well-tested code raises the denominator's share of
    # hard-to-test paths without anything actually getting worse.
    #
    # NOTE: this status does not currently post. No `codecov/project`
    # check has appeared on any PR -- including PRs predating this file,
    # when Codecov's defaults would have emitted one -- while
    # `codecov/patch` posts normally. Codecov has the data (it reports
    # ~93% for main and computes base/head totals per PR) and validates
    # this file as declaring both statuses, so the cause looks
    # repo-level and outside the repository. Until that is sorted out,
    # the real whole-project floor is enforced by the "Enforce total
    # coverage floor" step in .github/workflows/ci.yml.
    #
    # That step's floor is also 90, but the two are not the same
    # measurement and should not be kept numerically in sync just
    # because they agree today. Codecov counts partially-covered
    # branches separately, reporting ~93% for the same profile that
    # `go tool cover` scores ~95%. So a target that is comfortable in
    # CI can sit *above* actual Codecov-measured coverage and fail the
    # moment this status starts posting. If either number changes,
    # re-derive it from the tool that measures it.
    project:
      default:
        target: 90%
        threshold: 1%

    # patch judges only the lines a PR touches. Fixed rather than auto:
    # 90% is the bar, regardless of where the project average drifts.
    patch:
      default:
        target: 90%

# The PR comment's red X is not configurable. Do not try again.
#
# Codecov's comment opens with "Patch coverage is X% ... Please review."
# prefixed by a red X whenever patch coverage is below 100%, regardless of
# whether the `patch` target above was met. A PR hitting 96.6% against a 90%
# target therefore reads, at a glance, as a failure, while the
# `codecov/patch` check beside it reports `success`.
#
# That line is not something `layout` controls. With
#
#     comment:
#       layout: "files, condensed_footer"
#
# in place on the branch, the comment Codecov posted still carried the X
# above the table -- so no layout setting removes it. `comment: false`
# suppresses the whole comment and is the only lever that does.
#
# (Whether that `layout` value was honoured is undetermined and does not
# matter here: the comment it produced -- files table, footer, nothing else
# -- is also what this repo's DEFAULT comment renders, as PR #74 shows. The
# two are indistinguishable from the output, so do not read the trimmed
# shape of a past comment as proof that layout applied.)
#
# The X is not a verdict on the `patch` target above. It is a binary
# "is patch coverage 100%?" marker: PR #74, at 100%, got a green check from
# the same default config. Nothing configurable sits between those two
# states.
#
# Verified on PR #75 (2026-08-24), including that this file is read at all:
# temporarily setting `patch.target` to 1% on the branch made
# `codecov/patch` report "target 1.00%", so Codecov does read codecov.yml
# from the branch under test, exactly as its docs claim. An earlier note here
# claimed the opposite; it was wrong, and this replaces it.
#
# The `project` status above still does not post. Since this file demonstrably
# IS applied, that is not a YAML-loading problem and remains unexplained --
# which is why the real whole-project floor lives in ci.yml.
