name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # check-latest: without it, setup-go takes whatever 1.27.x the runner
      # has cached. v0.13.0 shipped built with go1.26.8, two security
      # releases behind (crypto/tls, net/http, crypto/x509).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
      # Scan a binary built by the same Go goreleaser is about to use, and
      # stop before anything is published if it carries a known
      # vulnerability. Binary mode reads the Go version and module list
      # embedded in the binary. Build it unstripped: goreleaser's -s -w
      # drops the symbol table, and govulncheck then reports every
      # vulnerable symbol in a linked module (v0.13.1 showed two in
      # x/net/html, a package plat does not compile in).
      - run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/plat" ./cmd/plat
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/plat"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
