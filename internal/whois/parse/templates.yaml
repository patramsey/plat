de:
  format: kv
  synonyms:
    changed: updated
jp:
  format: brackets
uk:
  format: indent
eu:
  format: indent
  synonyms:
    # EURid nests the registrar name under a sub-key ("Registrar:" has no
    # value of its own; the name is the next line's "Name:") -- the
    # generic kv tokenizer sees that as its own "name" pair, which isn't
    # a registrar synonym anywhere else (too generic/ambiguous to add
    # globally: it would just as easily mean a contact's name in a
    # different registry's format), so it's scoped to this template only.
    name: registrar
fr:
  format: kv
nl:
  # SIDN puts the registrar and nameservers on indented lines under
  # "Registrar:" and "Domain nameservers:" headers.
  format: indent
cz:
  format: kv
  synonyms:
    # CZ.NIC calls the domain's creation "registered"; the "created"
    # lines in its response belong to contact and nsset objects.
    registered: created
    changed: updated
    # "registrar: REG-SEZNAM" is the registrar's handle, not its name;
    # read as a name, it disagreed with RDAP's "Seznam.cz, a.s." on every
    # lookup.
    registrar: ""
  # "registered: 30.10.1997 01:00:00" is RDAP's 00:00Z; in summer,
  # "21.07.2000 15:21:00" is 13:21Z.
  timezone: Europe/Prague
br:
  format: kv
  synonyms:
    changed: updated
mx:
  format: kv
  synonyms:
    # NIC Mexico lists nameservers as "DNS:" lines under "Name Servers:".
    dns: nameservers
    # "state" is a status synonym globally (.jp, .ru and .se give domain
    # status that way), but NIC Mexico's "State:" lines are contacts'
    # Mexican states. Mapping to "" keeps them out of status.
    state: ""
be:
  # DNS Belgium: tab-indented sections, like EURid's.
  format: indent
  synonyms:
    # The registrar's name is nested: "Registrar:" then "Name:". No other
    # .be section carries a "Name:" line.
    name: registrar
    registered: created
it:
  # Section headers with no colon ("Nameservers", "Registrar") and
  # indented bodies. The registrant, contacts and registrar all have an
  # "Organization:" sub-key, so only the section-qualified form is mapped.
  format: indent
  synonyms:
    registrar organization: registrar
at:
  format: kv
  synonyms:
    changed: updated
gg: &cidr
  # Island Networks (.gg, .je): indented sections like Nominet's.
  format: indent
  synonyms:
    # The creation date is a sentence, the first line under "Relevant
    # dates:" ("Registered on 24th April 1997 at 00:00:00.000"); the
    # second is the yearly fee date, never read since created keeps its
    # first value.
    relevant dates: created
  dateLayouts:
    - "Registered on 2st January 2006 at 15:04:05.000"
    - "Registered on 2nd January 2006 at 15:04:05.000"
    - "Registered on 2rd January 2006 at 15:04:05.000"
    - "Registered on 2th January 2006 at 15:04:05.000"
je: *cidr
bo:
  format: kv
  synonyms:
    dominio: domain
    fecha de registro: created
    fecha de vencimiento: expires
lu:
  format: kv
  synonyms:
    domainname: domain
    registrar-name: registrar
il:
  format: kv
  # ISOC-IL answers a name with no record with its terms of use alone.
  commentOnlyIsNotFound: true
  synonyms:
    assigned: created
    validity: expires
  # Day-first: "assigned: 05-06-1999" is the "19990605 (Assigned)" audit
  # entry. Scoped here, where it cannot misread another registry's
  # month-first date.
  dateLayouts: ["02-01-2006"]
pl:
  format: kv
  # NASK lists the second and later nameservers on indented lines with
  # no key, some carrying IPv6 glue whose colons the kv tokenizer would
  # otherwise split on.
  continuationLines: true
  synonyms:
    # "option created" and "option expiration date" are a registration
    # option's dates, not the domain's, and stay unmapped.
    last modified: updated
  # "created: 2002.09.19 13:00:00" is RDAP's 11:00Z.
  timezone: Europe/Warsaw
mq:
  format: kv
  synonyms:
    # JWhoisServer: the domain block's "changed:" comes before any
    # contact block's, so the first one wins.
    changed: updated
# From the 2026-10-10 ccTLD sweep: data these WHOIS-only registries send
# that plat did not read.
aw:
  # SIDN's software, as .nl: indented sections.
  format: indent
bg:
  format: kv
  # "NAME SERVER INFORMATION:" then one host per line, some with glue.
  headerBlocks: true
  synonyms:
    name server information: nameservers
bn:
  format: kv
  # "Name Servers:" then one host per line.
  headerBlocks: true
sm:
  format: kv
  # "DNS Servers:" then one host per line. "Registration date:
  # 07/03/2000" stays unparsed: day- or month-first, nothing says which.
  headerBlocks: true
  synonyms:
    dns servers: nameservers
rs:
  format: kv
  synonyms:
    # "DNS: a.nic.rs - 91.199.17.59"
    dns: nameservers
sn:
  format: kv
  synonyms:
    nom de domaine: domain
    serveur de noms: nameservers
    # The domain's comes first; contacts' follow.
    dernière modification: updated
dk:
  format: kv
  synonyms:
    registered: created
    # "Hostname:" appears only under "Nameservers".
    hostname: nameservers
lt:
  format: kv
  synonyms:
    registered: created
am:
  format: kv
  synonyms:
    registered: created
    last modified: updated
kz:
  format: kv
  synonyms:
    current registrar: registrar
    last modified: updated
  dateLayouts: ["2006-01-02 15:04:05 (GMT+0:00)"]
cl:
  format: kv
  # NIC Chile labels every time CLST (UTC-3), winter dates included; read
  # as the label says, "2030-02-08 21:00:00 CLST" is midnight UTC. A
  # time labelled anything else stays unparsed.
  dateLayouts: ["2006-01-02 15:04:05 CLST"]
  timezone: Etc/GMT+3
tg:
  format: kv
  # JWhoisServer pads values with dots: "Activation:.........2023-03-02".
  paddedValues: true
  synonyms:
    activation: created
    expiration: expires
    name server (db): nameservers
